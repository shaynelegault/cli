name: Validate CLI draft with hardware 0.1.11
on:
  push:
    branches: [codex/p105-cli-validation]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c97d6c86113b4d3a4a6dd43fc288ee2b681cbbd3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OrchardLinux/hardware
          ref: ae1457edee7d2e52213e4d979aee02dbbeb90ce0
          path: .validation-hardware
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel --outdir out/hardware .validation-hardware
      - run: python -m build --wheel --outdir dist
      - run: |
          python -m pip install dist/*.whl out/hardware/*.whl
          python -m pip check
          python -c 'import importlib.metadata as m; assert m.version("orchard-hardware") == "0.1.11"'
          mkdir -p out/pair
          cp dist/*.whl out/hardware/*.whl out/pair/
      - uses: actions/upload-artifact@v4
        with:
          name: validation-wheel-pair
          path: out/pair/*.whl
          if-no-files-found: error
          retention-days: 2
  test:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c97d6c86113b4d3a4a6dd43fc288ee2b681cbbd3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: validation-wheel-pair
          path: out/pair
      - run: python -m pip install out/pair/*.whl && python -m pip check
      - run: python -m unittest discover -s tests -v
